<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Large Transfers</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><h1>Large Transfers</h1></header>
<main>
    <p><a th:href="@{/}">&larr; Back to dashboard</a></p>
    <section>
        <h2>Transfers above <span th:text="${#numbers.formatDecimal(min,1,'COMMA',2,'POINT')}"></span></h2>
        <form th:action="@{/large-transfers}" method="get">
            <input type="number" name="min" step="0.01" th:value="${min}">
            <button type="submit">Filter</button>
        </form>
        <table>
            <tr><th>ID</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Description</th><th>Time</th></tr>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.fromAccount}"></td>
                <td th:text="${t.toAccount}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.status}"></td>
                <td th:text="${t.description}"></td>
                <td th:text="${#temporals.format(t.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
        </table>
    </section>
</main>
</body>
</html>
